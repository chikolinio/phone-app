name: Project Lock CI
on:
  push:
    branches: [project-lock/v1-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Native configuration
        run: npm run check:native

  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate evidence-based readiness report
        run: node scripts/project-lock-readiness.mjs
      - name: Publish report to job summary
        run: cat project-lock-output/RELEASE_READINESS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-lock-readiness
          path: project-lock-output/
          retention-days: 30
